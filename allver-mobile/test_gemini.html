<!DOCTYPE html>
<html>
<head>
  <title>Gemini API Key Verification</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1e1e1e; color: #fff; }
    pre { background: #333; padding: 15px; border-radius: 5px; overflow-x: auto; color: #00ff00; }
    h2 { border-bottom: 1px solid #444; padding-bottom: 10px; }
    .status { font-weight: bold; font-size: 1.2em; }
    .success { color: #00ff00; }
    .error { color: #ff0000; }
  </style>
</head>
<body>
  <h2>Gemini API Key Verification Diagnostic</h2>
  <div id="status" class="status">Testing API Key...</div>
  <hr/>
  <h3>Response JSON:</h3>
  <pre id="response-content">Waiting for request to complete...</pre>

  <script>
    const apiKey = "YOUR_GEMINI_API_KEY";
    const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + apiKey;

    console.log("Calling endpoint:", endpoint);

    fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        contents: [
          {
            parts: [
              { text: "Hello" }
            ]
          }
        ]
      })
    })
    .then(async (res) => {
      const statusText = `HTTP Status: ${res.status} ${res.statusText}`;
      const statusEl = document.getElementById("status");
      statusEl.textContent = statusText;
      if (res.ok) {
        statusEl.className = "status success";
      } else {
        statusEl.className = "status error";
      }
      
      const body = await res.text();
      try {
        const parsed = JSON.parse(body);
        document.getElementById("response-content").textContent = JSON.stringify(parsed, null, 2);
      } catch(e) {
        document.getElementById("response-content").textContent = body;
      }
    })
    .catch((err) => {
      document.getElementById("status").textContent = "Network Error: " + err.message;
      document.getElementById("status").className = "status error";
      document.getElementById("response-content").textContent = err.stack;
    });
  </script>
</body>
</html>
